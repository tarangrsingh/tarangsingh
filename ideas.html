    --copper-glow: rgba(255, 138, 31, 0.30);
    --header-bg: rgba(217, 231, 255, 0.85); --bg-rgb: 217, 231, 255; --btn-bg: #ff8a1f; --btn-text: #0a1f5c; --btn-hover: #e67300;
  }

  body, header { transition: background-color 0.25s ease, color 0.25s ease; }
  html { scroll-behavior: smooth; scrollbar-width: none; -ms-overflow-style: none; }
  html::-webkit-scrollbar { display: none; }
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 19px;
    line-height: 1.68;
    overflow-x: hidden;
  }

  .wrap { max-width: var(--content-width, 640px); margin: 0 auto; padding: 48px 24px 96px; }
  @media (min-width: 1024px) { :root { --content-width: 780px; } .wrap { padding-top: 56px; } }
  @media (min-width: 1440px) { :root { --content-width: 860px; } }

  header {
    border-bottom: 1px solid var(--rule);
    margin-bottom: 40px;
    position: sticky;
    top: 0;
    background: var(--header-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 20;
  }
  .header-inner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px 24px;
    padding: 18px 24px;
    max-width: var(--content-width, 640px);
    margin: 0 auto;
    font-family: var(--font);
  }

  .home-doodle { display: inline-flex; line-height: 0; margin-left: 10px; }
  .home-doodle-icon { width: 23px; height: auto; transition: transform 0.2s ease; }
  .home-doodle:hover .home-doodle-icon,
  .home-doodle:focus-visible .home-doodle-icon { transform: translateY(-2px) scale(1.08); }

  .brand-star { display: inline-flex; line-height: 0; }
  .star-icon { width: 22px; height: auto; filter: drop-shadow(0 0 3px var(--copper-glow)); animation: star-shine 3.2s ease-in-out infinite; }
  @keyframes star-shine {
    0%, 100% { filter: brightness(1) drop-shadow(0 0 2px var(--copper-glow)); opacity: 0.85; }
    50% { filter: brightness(1.8) drop-shadow(0 0 6px var(--copper-glow)) drop-shadow(0 0 16px var(--copper-glow)); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .star-icon { animation: none; }
  }
  nav { display: flex; align-items: center; flex-wrap: wrap; margin-left: auto; }

  .theme-toggle {
    width: 32px; height: 32px; margin-left: 18px; border-radius: 50%;
    border: 1px solid var(--rule); background: none; display: inline-flex;
    align-items: center; justify-content: center; color: var(--muted);
    cursor: pointer; transition: color 0.2s ease, border-color 0.2s ease;
  }
  .theme-toggle:hover, .theme-toggle:focus-visible { color: var(--copper); border-color: var(--copper); }
  .theme-toggle svg { width: 17px; height: 17px; display: none; }
  .theme-toggle .icon-moon { display: block; }
  html.light-mode .theme-toggle .icon-moon { display: none; }
  html.light-mode .theme-toggle .icon-sun { display: block; }
  .theme-toggle:hover svg, .theme-toggle:focus-visible svg { animation: spin 3.5s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .theme-toggle:hover svg, .theme-toggle:focus-visible svg { animation: none; } }

  h1.page-title {
    font-family: var(--font);
    font-weight: 400;
    letter-spacing: -0.01em;
    font-size: clamp(2rem, 4.5vw, 3.2rem);
    line-height: 1.2;
    margin: 0 0 10px;
    color: var(--copper-light);
  }

  p { margin: 0 0 22px; }
  a { color: var(--link); }
  a:hover, a:focus-visible { color: var(--link-hover); }
  a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

  .section-subheading { font-size: 15px; color: var(--muted); margin: 0 0 40px; font-family: var(--font); }

  h2.section-heading {
    font-family: var(--font);
    font-weight: 600;
    font-size: 26px;
    margin: 44px 0 18px;
    color: var(--text);
  }
  h2.section-heading:first-of-type { margin-top: 0; }

  .reveal {
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .reveal.in-view { opacity: 1; transform: translateY(0); }

  .timeline { position: relative; margin: 0 0 8px; padding-left: 0; }
  .timeline::before {
    content: "";
    position: absolute;
    left: 27px; top: 6px; bottom: 6px;
    width: 2px;
    background: var(--rule);
  }
  .timeline-item { position: relative; padding-left: 72px; margin-bottom: 34px; cursor: pointer; outline: none; border-radius: 6px; }
  .timeline-item:last-child { margin-bottom: 0; }
  .timeline-item:focus-visible { box-shadow: 0 0 0 2px var(--copper-glow); }
  .timeline-logo {
    position: absolute; left: 0; top: 0;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--avatar-bg);
    border: 1px solid var(--rule);
    display: flex; align-items: center; justify-content: center;
    text-align: center; line-height: 1.1; overflow: hidden;
    font-family: var(--font);
    font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
    color: var(--copper-light);
  }
  .timeline-item:hover .timeline-logo, .timeline-item:focus-visible .timeline-logo { border-color: var(--copper); }
  .timeline-date {
    font-family: var(--font);
    font-size: 12.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--copper-light); margin-bottom: 4px;
  }
  .timeline-title {
    font-family: var(--font);
    font-weight: 600; font-size: 17px; color: var(--text); margin: 0 0 2px;
  }
  .timeline-item:hover .timeline-title, .timeline-item:focus-visible .timeline-title { color: var(--copper-light); }
  .timeline-sub { font-family: var(--font); font-size: 14px; color: var(--muted); margin: 0 0 8px; }
  .timeline-chevron {
    display: inline-block; width: 7px; height: 7px; margin-left: 5px;
    border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted);
    transform: rotate(45deg); transition: transform 0.25s ease, border-color 0.2s ease;
    vertical-align: 2px;
  }
  .timeline-item.is-open .timeline-chevron { transform: rotate(-135deg); }
  .timeline-item:hover .timeline-chevron, .timeline-item:focus-visible .timeline-chevron { border-color: var(--copper); }
  .timeline-details-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.35s ease; }
  .timeline-item.is-open .timeline-details-wrap { grid-template-rows: 1fr; }
  .timeline-details-inner { overflow: hidden; }
  .timeline-details-text { font-size: 15.5px; line-height: 1.55; color: var(--muted); font-style: italic; margin: 10px 0 0; }
  .project-card-image {
    width: 100%;
    max-width: 360px;
    aspect-ratio: 16 / 10;
    background: var(--rule);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-family: var(--font);
    font-size: 13px;
    margin-top: 8px;
  }
  .project-card-image img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 8px; }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
    .timeline-details-wrap { transition: none; }
  }
  @media (max-width: 480px) {
    .timeline::before { left: 21px; }
    .timeline-item { padding-left: 58px; }
    .timeline-logo { width: 44px; height: 44px; font-size: 9.5px; }
  }

  @media (max-width: 420px) {
    body { font-size: 17px; }
    .wrap { padding: 32px 18px 72px; }
    .header-inner { padding: 14px 18px; }
  }
  .contact { display: flex; gap: 14px; list-style: none; margin: 0; padding: 0 0 26px; border-bottom: 1px solid var(--rule); }
  .contact a {
    display: flex; align-items: center; justify-content: center;
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid var(--rule); color: var(--muted);
    transition: color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .contact a:hover, .contact a:focus-visible { transform: translateY(-2px) scale(1.06); }
  .contact a.gmail:hover, .contact a.gmail:focus-visible { color: #ea4335; border-color: #ea4335; }
  .contact a.linkedin:hover, .contact a.linkedin:focus-visible { color: #0a66c2; border-color: #0a66c2; }
  .contact a.blog:hover, .contact a.blog:focus-visible { color: #34c759; border-color: #34c759; }
  .contact a.youtube:hover, .contact a.youtube:focus-visible { color: #ff0000; border-color: #ff0000; }
  .contact a.twitter:hover, .contact a.twitter:focus-visible { color: var(--text); border-color: var(--text); }
  .contact svg { width: 18px; height: 18px; fill: currentColor; }
  .site-footer { margin-top: 40px; }
  .footer-copy {
    font-family: var(--font);
    font-size: 13px; color: var(--muted); margin: 24px 0 0;
  }
  .cursor-atoms { position: fixed; inset: 0; overflow: visible; pointer-events: none; z-index: 45; }
  .atom {
    position: absolute; top: 0; left: 0; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px;
    opacity: 0; transition: opacity 0.5s ease; will-change: transform;
  }
  .cursor-atoms.touch-mode .atom { transition: opacity 0.22s ease-out; }
  .atom.is-visible { opacity: 0.75; }
  .atom::before {
    content: ""; position: absolute; inset: 0; border: 1.3px solid var(--copper-light);
    border-radius: 50%; transform: rotate(35deg) scaleY(0.42);
    box-shadow: 0 0 3px var(--copper-glow);
  }
  .atom::after {
    content: ""; position: absolute; width: 3px; height: 3px; top: 50%; left: 50%;
    margin: -1.5px 0 0 -1.5px; background: var(--copper-light); border-radius: 50%;
    box-shadow: 0 0 4px var(--copper-glow);
  }
  .atom:nth-child(2) { width: 10px; height: 10px; margin: -5px 0 0 -5px; }
  .atom:nth-child(3) { width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; }
  .scrollgraph {
    position: fixed;
    top: 50%;
    right: 4px;
    z-index: 25;
    width: 52px;
    height: min(48vh, 420px);
    transform: translateY(-50%);
  }
  .scrollgraph-curve { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .sg-axis { stroke: var(--rule); stroke-width: 2; }
  .scrollgraph-range {
    -webkit-appearance: none;
    appearance: none;
    position: absolute;
    top: 50%;
    left: 50%;
    background: transparent;
    width: min(48vh, 420px);
    height: 46px;
    margin: 0;
    cursor: ns-resize;
    transform: translate(-50%, -50%) rotate(-90deg);
  }
  .scrollgraph-range:focus-visible { outline: none; }
  .scrollgraph-range::-webkit-slider-runnable-track { width: 100%; height: 46px; background: transparent; }
  .scrollgraph-range::-moz-range-track { width: 100%; height: 46px; background: transparent; border: none; }
  .scrollgraph-range::-webkit-slider-thumb { -webkit-appearance: none; width: 1px; height: 1px; opacity: 0; }
  .scrollgraph-range::-moz-range-thumb { width: 1px; height: 1px; opacity: 0; border: none; }
  @media (max-width: 640px) {
    .scrollgraph { display: none; }
  }

  .star-hero { display: flex; justify-content: center; margin: 8px 0 28px; }
  .star-hero .star-icon { width: 92px; height: auto; }

  /* Header name: a soft light follows the cursor and a hairline grows underneath; nothing moves (see script) */
  .header-inner { position: relative; }
  .site-name {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2;
    margin: 0; padding: 10px 14px; line-height: 1; white-space: nowrap; text-decoration: none;
    font-family: var(--font);
    font-weight: 500; font-size: clamp(0.95rem, 4.2vw, 1.2rem); letter-spacing: 0.02em;
    color: var(--text); -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .site-name .sn-letters { position: relative; display: inline-flex; }
  .site-name .sn-l { display: inline-block; white-space: pre; --k: 0; }
  @supports (color: color-mix(in srgb, red 50%, blue)) {
    .site-name .sn-l {
      color: color-mix(in srgb, var(--copper-light) calc(var(--k) * 100%), var(--text));
      text-shadow: 0 0 calc(var(--k) * 10px) var(--copper-glow);
    }
  }
  .site-name .sn-rule {
    position: absolute; left: 0; right: 0; bottom: -7px; height: 1px; pointer-events: none; opacity: 0.75;
    background: linear-gradient(90deg, transparent, var(--copper) 22%, var(--copper) 78%, transparent);
    transform: scaleX(0); transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .site-name.is-live .sn-rule { transform: scaleX(1); }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  @media (max-width: 360px) { .site-name { padding-left: 6px; padding-right: 6px; } }

  /* Scroll graph: thin lines instead of blocks */
  .sg-line { stroke: var(--copper-light); stroke-width: 1.6; stroke-linecap: round; vector-effect: non-scaling-stroke; transition: stroke 0.18s ease-out; }
  .scrollgraph.is-active .sg-line { stroke: var(--copper); }
  .scrollgraph:hover .sg-line, .scrollgraph:focus-within .sg-line { stroke: var(--text); }
  @media (pointer: coarse) { .scrollgraph-range { pointer-events: none; } }

  /* Liquid-glass buttons: translucent, blurred, with a soft top sheen */
  .theme-toggle, .contact a, .send-btn {
    position: relative; overflow: hidden; isolation: isolate;
    -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), inset 0 -8px 14px -10px rgba(255, 255, 255, 0.15), 0 6px 18px -8px rgba(0, 0, 0, 0.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .theme-toggle::before, .contact a::before, .send-btn::before {
    content: ""; position: absolute; left: -15%; right: -15%; top: -60%; height: 70%;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0) 75%);
    transform: rotate(-8deg); pointer-events: none;
  }
  .theme-toggle, .contact a {
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.04));
    border-color: rgba(255, 255, 255, 0.32);
  }
  html.light-mode .theme-toggle, html.light-mode .contact a {
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.15));
    border-color: rgba(255, 255, 255, 0.65);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 6px 16px -8px rgba(20, 20, 30, 0.25);
  }
  .send-btn {
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.08) 55%, transparent 80%), var(--btn-bg);
    border: 1px solid rgba(255, 255, 255, 0.5) !important;
  }
  @media (hover: hover) {
    .theme-toggle:hover, .contact a:hover, .send-btn:hover:not([disabled]) {
      transform: translateY(-2px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 10px 22px -8px rgba(0, 0, 0, 0.45);
    }
  }
  .theme-toggle:active, .contact a:active, .send-btn:active:not([disabled]) { transform: translateY(0) scale(0.97); }

<script>
  (function () {
    var toggle = document.getElementById('theme-toggle');
    if (!toggle) return;
    function sync() {
      var light = document.documentElement.classList.contains('light-mode');
      toggle.setAttribute('aria-pressed', light);
      toggle.setAttribute('aria-label', light ? 'Switch to dark mode' : 'Switch to light mode');
    }
    sync();
    toggle.addEventListener('click', function () {
      var light = document.documentElement.classList.toggle('light-mode');
      try { localStorage.setItem('theme', light ? 'light' : 'dark'); } catch (e) {}
      sync();
    });
  })();

  var yearEl = document.querySelector('[data-year]');
  if (yearEl) yearEl.textContent = new Date().getFullYear();

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Scroll reveal
  var revealEls = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window && !reduceMotion) {
    revealEls.forEach(function (el, i) {
      el.style.transitionDelay = (i % 6) * 0.06 + 's';
    });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    revealEls.forEach(function (el) { io.observe(el); });
  } else {
    revealEls.forEach(function (el) { el.classList.add('in-view'); });
  }

  // Interactive timeline: click or press Enter/Space to expand a milestone
  document.querySelectorAll('.timeline-item').forEach(function (item) {
    function toggle() {
      var open = item.classList.toggle('is-open');
      item.setAttribute('aria-expanded', open);
    }
    item.addEventListener('click', toggle);
    item.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
  });

  // Cursor stars: with a mouse/trackpad they trail the pointer; on touch they gather around the finger. One spring loop
  // drives both (no CSS transitions on movement), and the fake mouse events iOS/iPadOS fires after a tap are ignored.
  var atomsWrap = document.getElementById('cursor-atoms');
  if (atomsWrap && !reduceMotion) {
    (function () {
      var atoms = atomsWrap.querySelectorAll('.atom');
      var WM = [64, 42, 28], WT = [46, 40, 36], OFF = [[0, -9], [8, 6], [-8, 6]];
      var parts = Array.prototype.map.call(atoms, function () { return { x: 0, y: 0, vx: 0, vy: 0 }; });
      var tx = 0, ty = 0, mode = 'mouse', raf = 0, last = 0, parked = true, hideTimer = null, parkTimer = null, lastTouch = 0;
      function goal(i, cx, cy) { return mode === 'touch' ? [tx + OFF[i][0], ty + OFF[i][1]] : [cx, cy]; }
      function put(i) { atoms[i].style.transform = 'translate3d(' + parts[i].x.toFixed(2) + 'px,' + parts[i].y.toFixed(2) + 'px,0)'; }
      function frame(t) {
        var dt = Math.min(Math.max((t - last) / 1000, 0), 0.05), W = mode === 'touch' ? WT : WM, cx = tx, cy = ty, busy = false;
        last = t;
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i], g = goal(i, cx, cy), w = W[i], e = Math.exp(-w * dt);
          var dx = p.x - g[0], dy = p.y - g[1], jx = p.vx + w * dx, jy = p.vy + w * dy;
          p.x = g[0] + (dx + jx * dt) * e; p.y = g[1] + (dy + jy * dt) * e;
          p.vx = (p.vx - jx * w * dt) * e; p.vy = (p.vy - jy * w * dt) * e;
          if (Math.abs(p.x - g[0]) > 0.05 || Math.abs(p.y - g[1]) > 0.05 || Math.abs(p.vx) > 0.5 || Math.abs(p.vy) > 0.5) busy = true;
          put(i); if (mode === 'mouse') { cx = p.x; cy = p.y; }
        }
        raf = busy ? requestAnimationFrame(frame) : 0;
      }
      function start() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } }
      function show(ms) { atoms.forEach(function (a) { a.classList.add('is-visible'); }); clearTimeout(hideTimer); hideTimer = setTimeout(hide, ms); }
      function hide() { atoms.forEach(function (a) { a.classList.remove('is-visible'); }); clearTimeout(parkTimer); parkTimer = setTimeout(function () { parked = true; }, 550); }
      function aim(x, y, m) {
        tx = x; ty = y; mode = m; atomsWrap.classList.toggle('touch-mode', m === 'touch'); clearTimeout(parkTimer);
        if (parked) { parked = false; parts.forEach(function (p, i) { var g = goal(i, x, y); p.x = g[0]; p.y = g[1]; p.vx = 0; p.vy = 0; put(i); }); }
        start();
      }
      document.addEventListener('mousemove', function (e) {
        if (Date.now() - lastTouch < 800) return;
        aim(e.clientX, e.clientY, 'mouse'); show(2200);
      }, { passive: true });
      document.documentElement.addEventListener('mouseleave', function () { clearTimeout(hideTimer); hide(); });
      function touched(e) { lastTouch = Date.now(); var t = e.touches[0]; if (t) { aim(t.clientX, t.clientY, 'touch'); show(180); } }
      function lifted() { lastTouch = Date.now(); clearTimeout(hideTimer); hide(); }
      document.addEventListener('touchstart', touched, { passive: true });
      document.addEventListener('touchmove', touched, { passive: true });
      document.addEventListener('touchend', lifted, { passive: true });
      document.addEventListener('touchcancel', lifted, { passive: true });
      document.addEventListener('scroll', function () { if (mode === 'touch' && !parked && Date.now() - lastTouch < 2500) show(180); }, { passive: true });
    })();
  }

  // Side graph: thin horizontal lines along the y-axis; their lengths trace a smooth bell curve that peaks at the scroll
  // position and swells with scroll speed. Springs keep every change smooth.
  (function () {
    var scrollRange = document.getElementById('scrollgraph-range');
    var linesG = document.getElementById('sg-lines');
    if (!scrollRange || !linesG) return;
    var scrollWrap = document.querySelector('.scrollgraph');
    var LINES = 64, base = 8, sigma = 100, step = 1000 / LINES, ls = [];
    for (var li = 0; li < LINES; li++) {
      var ln = document.createElementNS('http://www.w3.org/2000/svg', 'line'), yy = (step * (li + 0.5)).toFixed(1);
      ln.setAttribute('class', 'sg-line'); ln.setAttribute('x1', 60 - base); ln.setAttribute('x2', 60 - base - 3);
      ln.setAttribute('y1', yy); ln.setAttribute('y2', yy); linesG.appendChild(ln); ls.push(ln);
    }
    function maxScroll() { return Math.max(document.documentElement.scrollHeight - window.innerHeight, 1); }
    var peak = 0, peakV = 0, amp = 24, ampV = 0, peakT = 0, ampT = 24, raf = 0, last = 0;
    function draw() {
      for (var i = 0; i < LINES; i++) {
        var dy = step * (i + 0.5) - peak, g = Math.exp(-(dy * dy) / (2 * sigma * sigma));
        ls[i].setAttribute('x2', (60 - base - 3 - amp * g).toFixed(2));
        ls[i].style.opacity = (0.3 + 0.7 * g).toFixed(2);
      }
    }
    function spring(x, v, target, w, dt) {
      var e = Math.exp(-w * dt), d = x - target, j = v + w * d;
      return [target + (d + j * dt) * e, (v - j * w * dt) * e];
    }
    function frame(t) {
      var dt = Math.min(Math.max((t - last) / 1000, 0), 0.05), a, b;
      last = t; a = spring(peak, peakV, peakT, 22, dt); b = spring(amp, ampV, ampT, 14, dt);
      peak = a[0]; peakV = a[1]; amp = b[0]; ampV = b[1]; draw();
      raf = (Math.abs(peak - peakT) > 0.3 || Math.abs(peakV) > 0.5 || Math.abs(amp - ampT) > 0.05 || Math.abs(ampV) > 0.05) ? requestAnimationFrame(frame) : 0;
    }
    function start() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } }
    var lastY = window.scrollY, lastT = performance.now(), idleTimer = null;
    function syncFromScroll() {
      var y = window.scrollY, frac = Math.min(Math.max(y / maxScroll(), 0), 1);
      peakT = frac * 1000; scrollRange.value = Math.round(frac * 1000);
      if (reduceMotion) { peak = peakT; amp = 24; draw(); return; }
      var now = performance.now(), v = Math.abs(y - lastY) / Math.max(now - lastT, 1);
      lastY = y; lastT = now; ampT = Math.min(24 + v * 46, 46);
      scrollWrap.classList.add('is-active'); clearTimeout(idleTimer);
      idleTimer = setTimeout(function () { scrollWrap.classList.remove('is-active'); ampT = 24; start(); }, 260);
      start();
    }
    var tickRaf = null;
    window.addEventListener('resize', syncFromScroll);
    window.addEventListener('scroll', function () {
      if (!tickRaf) tickRaf = requestAnimationFrame(function () { syncFromScroll(); tickRaf = null; });
    }, { passive: true });
    scrollRange.addEventListener('input', function () { window.scrollTo(0, (scrollRange.value / 1000) * maxScroll()); });
    peak = peakT = Math.min(Math.max(window.scrollY / maxScroll(), 0), 1) * 1000; draw(); syncFromScroll();
  })();
</script>
<script>
// Header name: one soft light glides through the letters on load; after that it only appears where your cursor
// (or finger) is, with a hairline growing underneath. Letters never move. Plain text for screen readers / reduced motion.
(function () {
  var host = document.querySelector('.site-name');
  if (!host || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var src = host.querySelector('.sn-text'), text = src.textContent.trim();
  var wrap = document.createElement('span'); wrap.className = 'sn-letters'; wrap.setAttribute('aria-hidden', 'true');
  var L = Array.from(text).map(function (ch) {
    var s = document.createElement('span'); s.className = 'sn-l'; s.textContent = ch; wrap.appendChild(s); return s;
  });
  wrap.insertAdjacentHTML('beforeend', '<span class="sn-rule"></span>');
  src.classList.add('sr-only'); host.appendChild(wrap);

  var n = L.length, k = L.map(function () { return 0; });
  var cx = [], left = 0, ptr = null, glint = null, raf = 0, last = 0;
  function measure() {
    left = wrap.getBoundingClientRect().left;
    cx = L.map(function (s) { return s.offsetLeft + s.offsetWidth / 2; });
  }
  function toIndex(px) {                       // pointer x (px) -> fractional letter index
    if (px <= cx[0]) return (px - cx[0]) / (cx[1] - cx[0]);
    for (var i = 0; i < n - 1; i++) if (px <= cx[i + 1]) return i + (px - cx[i]) / (cx[i + 1] - cx[i]);
    return n - 1 + (px - cx[n - 1]) / (cx[n - 1] - cx[n - 2]);
  }
  function bump(i, c, s) { var d = i - c; return Math.exp(-(d * d) / (2 * s * s)); }
  function frame(t) {
    var dt = Math.min(Math.max((t - last) / 1000, 0), 0.05), a = 1 - Math.exp(-dt / 0.14), busy = false;
    last = t;
    if (glint !== null) { glint += dt * 5; if (glint > n + 3) glint = null; }
    var pos = ptr === null ? null : toIndex(ptr);
    for (var i = 0; i < n; i++) {
      var tk = 0;
      if (pos !== null) tk = 0.8 * bump(i, pos, 2.2);
      if (glint !== null) tk = Math.max(tk, 0.7 * bump(i, glint, 1.6));
      k[i] += (tk - k[i]) * a;
      if (Math.abs(tk - k[i]) > 0.003) busy = true;
      L[i].style.setProperty('--k', k[i].toFixed(3));
    }
    raf = (busy || ptr !== null || glint !== null) ? requestAnimationFrame(frame) : 0;
  }
  function start() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } }
  function move(e) { measure(); ptr = e.clientX - left; host.classList.add('is-live'); start(); }
  host.addEventListener('pointerenter', move);
  host.addEventListener('pointermove', move);
  host.addEventListener('pointerleave', function () { ptr = null; host.classList.remove('is-live'); start(); });
  host.addEventListener('pointerdown', function () { if (glint === null) { glint = -2; start(); } });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  measure(); setTimeout(function () { glint = -2; start(); }, 1200);
})();
</script>
