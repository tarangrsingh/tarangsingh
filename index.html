<style>
  :root {
    --bg: #0a0c10;
    --text: #e9e7e2;
    --muted: #8c919c;
    --link: #c89b5a;
    --link-hover: #e4c08d;
    --rule: #222731;
    --avatar-bg: #141820;
    --copper: #c89b5a;
    --copper-light: #e4c08d;
    --copper-glow: rgba(200, 155, 90, 0.38);
    --header-bg: rgba(10, 12, 16, 0.82);
  }

  html.light-mode {
    --bg: #faf8f3;
    --text: #15181d;
    --muted: #656b76;
    --link: #8a6220;
    --link-hover: #6d4c16;
    --rule: #e4dfd3;
    --avatar-bg: #efeade;
    --copper: #8a6220;
    --copper-light: #7a5519;
    --copper-glow: rgba(138, 98, 32, 0.26);
    --header-bg: rgba(250, 248, 243, 0.85);
  }

  body, .name, header { transition: background-color 0.25s ease, color 0.25s ease; }

  html { scroll-behavior: smooth; scrollbar-width: none; -ms-overflow-style: none; }
  html::-webkit-scrollbar { display: none; }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    font-size: 19px;
    line-height: 1.68;
    overflow-x: hidden;
  }

  .wrap {
    max-width: var(--content-width, 640px);
    margin: 0 auto;
    padding: 48px 24px 96px;
  }

  @media (min-width: 1024px) {
    :root { --content-width: 780px; }
    .wrap { padding-top: 56px; }
  }
  @media (min-width: 1440px) {
    :root { --content-width: 860px; }
  }

  header {
    border-bottom: 1px solid var(--rule);
    margin-bottom: 40px;
    position: sticky;
    top: 0;
    background: var(--header-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 20;
  }

  .header-inner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px 24px;
    padding: 18px 24px;
    max-width: var(--content-width, 640px);
    margin: 0 auto;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .home-doodle {
    display: inline-flex;
    line-height: 0;
    margin-left: 10px;
  }
  .home-doodle-icon {
    width: 23px;
    height: auto;
    transition: transform 0.2s ease;
  }
  .home-doodle:hover .home-doodle-icon,
  .home-doodle:focus-visible .home-doodle-icon {
    transform: translateY(-2px) scale(1.08);
  }

  .brand-star { display: inline-flex; line-height: 0; }
  .star-icon { width: 22px; height: auto; filter: drop-shadow(0 0 3px var(--copper-glow)); animation: star-shine 3.2s ease-in-out infinite; }
  @keyframes star-shine {
    0%, 100% { filter: brightness(1) drop-shadow(0 0 2px var(--copper-glow)); opacity: 0.85; }
    50% { filter: brightness(1.8) drop-shadow(0 0 6px var(--copper-glow)) drop-shadow(0 0 16px var(--copper-glow)); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .star-icon { animation: none; }
  }
  nav {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    margin-left: auto;
  }
  .theme-toggle {
    width: 32px;
    height: 32px;
    margin-left: 18px;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .theme-toggle:hover, .theme-toggle:focus-visible {
    color: var(--copper);
    border-color: var(--copper);
  }
  .theme-toggle svg { width: 17px; height: 17px; display: none; }
  .theme-toggle .icon-moon { display: block; }
  html.light-mode .theme-toggle .icon-moon { display: none; }
  html.light-mode .theme-toggle .icon-sun { display: block; }
  .theme-toggle:hover svg, .theme-toggle:focus-visible svg {
    animation: spin 3.5s linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .theme-toggle:hover svg, .theme-toggle:focus-visible svg { animation: none; }
  }
  .hero {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 26px;
    margin-bottom: 36px;
    overflow: visible;
  }

  .avatar-wrap {
    position: relative;
    display: inline-flex;
    flex-shrink: 0;
  }
  .avatar-wrap::after {
    content: "";
    position: absolute;
    inset: -7px;
    border-radius: 50%;
    border: 1px solid var(--copper);
    opacity: 0;
  }
  .avatar-wrap:hover::after {
    animation: resonance 1.5s ease-out infinite;
  }

  .avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: var(--avatar-bg);
    object-fit: cover;
    display: block;
    border: 1px solid var(--rule);
  }

  .name {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-weight: 400;
    letter-spacing: -0.01em;
    font-size: clamp(2.2rem, 5vw, 3.9rem);
    line-height: 1.2;
    padding: 4px 2px 8px;
    margin: 0;
    color: var(--copper-light);
    background: linear-gradient(100deg, var(--text) 20%, var(--copper-light) 45%, var(--text) 70%);
    background-size: 220% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px var(--copper-glow);
    animation: shine 7s ease-in-out infinite;
    overflow: visible;
  }

  @keyframes shine {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  @keyframes resonance {
    0% { transform: scale(1); opacity: 0.55; }
    100% { transform: scale(1.4); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .name { animation: none; }
    .avatar-wrap:hover::after { animation: none; opacity: 0.4; }
  }

  .contact { display: flex; gap: 14px; list-style: none; margin: 0; padding: 0 0 26px; border-bottom: 1px solid var(--rule); }
  .contact a {
    display: flex; align-items: center; justify-content: center;
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid var(--rule); color: var(--muted);
    transition: color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .contact a:hover, .contact a:focus-visible { transform: translateY(-2px) scale(1.06); }
  .contact a.gmail:hover, .contact a.gmail:focus-visible { color: #ea4335; border-color: #ea4335; }
  .contact a.linkedin:hover, .contact a.linkedin:focus-visible { color: #0a66c2; border-color: #0a66c2; }
  .contact a.blog:hover, .contact a.blog:focus-visible { color: #34c759; border-color: #34c759; }
  .contact a.youtube:hover, .contact a.youtube:focus-visible { color: #ff0000; border-color: #ff0000; }
  .contact a.twitter:hover, .contact a.twitter:focus-visible { color: var(--text); border-color: var(--text); }
  .contact svg { width: 18px; height: 18px; fill: currentColor; }
  .site-footer { margin-top: 40px; }
  .tab-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin: 6px 0 4px; }
  @media (max-width: 560px) { .tab-grid { grid-template-columns: 1fr; } }
  .tab-card {
    position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 30px 18px; border: 1px solid var(--rule); border-radius: 12px; background: var(--avatar-bg);
    text-decoration: none; color: var(--text); text-align: center;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease-out;
  }
  .tab-card > * { position: relative; z-index: 1; }
  .tab-card:is(:hover, :focus-visible) {
    border-color: var(--copper); box-shadow: 0 14px 30px -18px var(--copper-glow);
    transform: perspective(700px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(-3px);
  }
  .tab-card:active { transform: perspective(700px) translateY(-1px) scale(0.97); }
  .tab-card::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(140px circle at var(--mx, 50%) var(--my, 50%), var(--copper-glow), transparent 70%);
    transition: opacity 0.3s ease;
  }
  .tab-card:is(:hover, :focus-visible)::before { opacity: 1; }
  .tab-card h3 {
    margin: 0; font-size: 14.5px; font-weight: 600;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--copper-light);
  }
  .tab-icon-svg {
    width: 56px; height: 56px; overflow: visible;
    transform: translate(var(--ix, 0px), var(--iy, 0px));
    transition: transform 0.25s ease-out;
  }
  .tab-card:is(:hover, :focus-visible) .tab-icon-svg {
    transform: translate(var(--ix, 0px), var(--iy, 0px)) scale(1.12);
  }

  /* Scholastic Achievements: medal swings on its ribbon, star pops, sparkles twinkle */
  .medal .swing { transform-origin: 32px 3px; }
  .medal .m-star, .medal .spark { transform-box: fill-box; transform-origin: center; }
  .medal .spark { transform: scale(0); opacity: 0; }
  .tab-card:is(:hover, :focus-visible) .medal .swing { animation: medal-swing 1.5s ease-in-out infinite; }
  .tab-card:is(:hover, :focus-visible) .medal .m-star { animation: star-pop 1.2s ease-in-out infinite; }
  .tab-card:is(:hover, :focus-visible) .medal .spark { animation: twinkle 1.1s var(--d, 0s) ease-in-out infinite; }
  @keyframes medal-swing { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-9deg); } 75% { transform: rotate(9deg); } }
  @keyframes star-pop { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.25) rotate(36deg); } }
  @keyframes twinkle { 0%, 100% { transform: scale(0); opacity: 0; } 50% { transform: scale(1); opacity: 1; } }

  /* CV: sheet tilts, photo bobs, text lines write themselves in */
  .cv .cv-sheet { transform-origin: 32px 58px; transition: transform 0.3s ease; }
  .tab-card:is(:hover, :focus-visible) .cv .cv-sheet { transform: rotate(-4deg) translateY(-2px); }
  .tab-card:is(:hover, :focus-visible) .cv .cv-head { animation: cv-bob 0.9s ease-in-out infinite; }
  .tab-card:is(:hover, :focus-visible) .cv .cv-line { animation: cv-draw 0.45s calc(var(--i) * 0.1s) ease-out both; }
  @keyframes cv-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.6px); } }
  @keyframes cv-draw {
    from { stroke-dasharray: 1; stroke-dashoffset: 1; }
    to { stroke-dasharray: 1; stroke-dashoffset: 0; }
  }

  /* Contact: flap opens, letter slides out */
  .envelope .flap-closed, .envelope .flap-open { transform-origin: 32px 20px; transition: transform 0.3s ease, opacity 0.3s ease; }
  .envelope .flap-open { transform: scaleY(0); opacity: 0; transition-delay: 0.12s; }
  .envelope .letter { transition: transform 0.4s cubic-bezier(0.3, 1.4, 0.5, 1) 0.14s; }
  .tab-card:is(:hover, :focus-visible) .envelope .flap-closed { transform: scaleY(0); opacity: 0; }
  .tab-card:is(:hover, :focus-visible) .envelope .flap-open { transform: scaleY(1); opacity: 1; }
  .tab-card:is(:hover, :focus-visible) .envelope .letter { transform: translateY(-12px); }

  @media (prefers-reduced-motion: reduce) {
    .tab-card, .tab-card *, .tab-card::before { transition: none !important; }
    .tab-card * { animation: none !important; }
    .tab-card:is(:hover, :focus-visible) .tab-icon-svg { transform: none; }
  }
  .footer-copy {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px; color: var(--muted); margin: 24px 0 0;
  }
  .cursor-atoms { position: fixed; inset: 0; overflow: visible; pointer-events: none; z-index: 45; }
  .atom {
    position: fixed; top: 0; left: 0; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px;
    opacity: 0; transition: opacity 0.5s ease; will-change: transform;
  }
  .cursor-atoms.touch-mode .atom { transition: opacity 0.22s ease-out, transform 0.2s ease-out; }
  .atom.is-visible { opacity: 0.75; }
  .atom::before {
    content: ""; position: absolute; inset: 0; border: 1.3px solid var(--copper-light);
    border-radius: 50%; transform: rotate(35deg) scaleY(0.42);
    filter: drop-shadow(0 0 3px var(--copper-glow));
  }
  .atom::after {
    content: ""; position: absolute; width: 3px; height: 3px; top: 50%; left: 50%;
    margin: -1.5px 0 0 -1.5px; background: var(--copper-light); border-radius: 50%;
    box-shadow: 0 0 4px var(--copper-glow);
  }
  .atom:nth-child(2) { width: 10px; height: 10px; margin: -5px 0 0 -5px; }
  .atom:nth-child(3) { width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; }
  .scrollgraph {
    position: fixed;
    top: 50%;
    right: 4px;
    z-index: 25;
    width: 52px;
    height: min(48vh, 420px);
    transform: translateY(-50%);
  }
  .scrollgraph-curve { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; transform: scaleX(-1); }
  .sg-axis { stroke: var(--rule); stroke-width: 2; }
  .sg-fill { fill: var(--copper-light); opacity: 0.16; stroke: none; transition: d 0.2s ease-out, opacity 0.18s ease-out; }
  .scrollgraph.is-active .sg-fill { opacity: 0.3; }
  .sg-wave {
    fill: none;
    stroke: var(--copper-light);
    stroke-width: 3.5;
    stroke-linecap: butt;
    stroke-linejoin: miter;
    filter: drop-shadow(0 0 3px var(--copper-glow));
    transition: d 0.2s ease-out, stroke 0.18s ease-out;
  }
  .scrollgraph.is-active .sg-wave { stroke: var(--copper); }
  .scrollgraph:hover .sg-wave, .scrollgraph:focus-within .sg-wave { stroke: var(--text); }
  .scrollgraph-range {
    -webkit-appearance: none;
    appearance: none;
    position: absolute;
    top: 50%;
    left: 50%;
    background: transparent;
    width: min(48vh, 420px);
    height: 46px;
    margin: 0;
    cursor: ns-resize;
    transform: translate(-50%, -50%) rotate(-90deg);
  }
  .scrollgraph-range:focus-visible { outline: none; }
  .scrollgraph-range::-webkit-slider-runnable-track { width: 100%; height: 46px; background: transparent; }
  .scrollgraph-range::-moz-range-track { width: 100%; height: 46px; background: transparent; border: none; }
  .scrollgraph-range::-webkit-slider-thumb { -webkit-appearance: none; width: 1px; height: 1px; opacity: 0; }
  .scrollgraph-range::-moz-range-thumb { width: 1px; height: 1px; opacity: 0; border: none; }
  @media (prefers-reduced-motion: reduce) {
    .sg-wave { transition: stroke 0.18s ease-out; }
  }
  @media (max-width: 640px) {
    .scrollgraph { display: none; }
  }

  p { margin: 0 0 22px; }

  a { color: var(--link); }
  a:hover, a:focus-visible { color: var(--link-hover); }
  a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

  .section-heading {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-weight: 600;
    font-size: 26px;
    letter-spacing: -0.01em;
    margin: 52px 0 6px;
    color: var(--text);
  }
  .section-subheading {
    font-size: 15px;
    color: var(--muted);
    margin: 0 0 36px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .timeline {
    position: relative;
    margin: 0 0 8px;
    padding-left: 0;
  }
  .timeline::before {
    content: "";
    position: absolute;
    left: 27px;
    top: 6px;
    bottom: 6px;
    width: 2px;
    background: var(--rule);
  }
  .timeline-item {
    position: relative;
    padding-left: 72px;
    margin-bottom: 34px;
  }
  .timeline-item:last-child { margin-bottom: 0; }
  .timeline-logo {
    position: absolute;
    left: 0;
    top: 0;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--avatar-bg);
    border: 1px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.1;
    overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--copper-light);
  }
  .timeline-logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }
  .timeline-date {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--copper-light);

  }
  .timeline-title {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 600;
    font-size: 17px;
    color: var(--text);
    margin: 0 0 2px;
  }
  .timeline-sub {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 8px;
  }
  .reveal {
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .reveal.in-view { opacity: 1; transform: translateY(0); }

  .timeline-item { cursor: pointer; outline: none; border-radius: 6px; }
  .timeline-item:hover .timeline-title,
  .timeline-item:focus-visible .timeline-title { color: var(--copper-light); }
  .timeline-item:focus-visible { box-shadow: 0 0 0 2px var(--copper-glow); }
  .timeline-item:hover .timeline-logo,
  .timeline-item:focus-visible .timeline-logo { border-color: var(--copper); }
  .timeline-chevron {
    display: inline-block;
    width: 7px; height: 7px;
    margin-left: 5px;
    border-right: 1.6px solid var(--muted);
    border-bottom: 1.6px solid var(--muted);
    transform: rotate(45deg);
    transition: transform 0.25s ease, border-color 0.2s ease;
    vertical-align: 2px;
  }
  .timeline-item.is-open .timeline-chevron { transform: rotate(-135deg); }
  .timeline-item:hover .timeline-chevron,
  .timeline-item:focus-visible .timeline-chevron { border-color: var(--copper); }
  .timeline-details-wrap {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.35s ease;
  }
  .timeline-item.is-open .timeline-details-wrap { grid-template-rows: 1fr; }
  .timeline-details-inner { overflow: hidden; }
  .timeline-details-text {
    font-size: 15.5px;
    line-height: 1.55;
    color: var(--muted);
    font-style: italic;
    margin: 8px 0 0;
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
    .timeline-details-wrap { transition: none; }
  }

  @media (max-width: 480px) {
    .timeline::before { left: 21px; }
    .timeline-item { padding-left: 58px; }
    .timeline-logo { width: 44px; height: 44px; font-size: 9.5px; }
  }

  @media (max-width: 420px) {
    body { font-size: 17px; }
    .wrap { padding: 32px 18px 72px; }
    .header-inner { padding: 14px 18px; }
  }
</style>
<script>
  (function () {
    try { if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light-mode'); } catch (e) {}
  })();
</script>

<header>
  <div class="header-inner">
    <a href="star.html" class="brand-star" aria-label="Tarang Singh — home">

<script>
  (function () {
    var toggle = document.getElementById('theme-toggle');
    if (!toggle) return;
    function sync() {
      var light = document.documentElement.classList.contains('light-mode');
      toggle.setAttribute('aria-pressed', light);
      toggle.setAttribute('aria-label', light ? 'Switch to dark mode' : 'Switch to light mode');
    }
    sync();
    var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    document.querySelectorAll('.tab-card').forEach(function (card) {
      card.addEventListener('mousemove', function (e) {
        var r = card.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
        var px = x / r.width - 0.5, py = y / r.height - 0.5;
        card.style.setProperty('--mx', x + 'px');
        card.style.setProperty('--my', y + 'px');
        if (calm) return;
        card.style.setProperty('--rx', (-py * 10).toFixed(1) + 'deg');
        card.style.setProperty('--ry', (px * 10).toFixed(1) + 'deg');
        card.style.setProperty('--ix', (px * 10).toFixed(1) + 'px');
        card.style.setProperty('--iy', (py * 10).toFixed(1) + 'px');
      });
      card.addEventListener('mouseleave', function () {
        ['--rx', '--ry', '--ix', '--iy'].forEach(function (p) { card.style.removeProperty(p); });
      });
    });
    toggle.addEventListener('click', function () {
      var light = document.documentElement.classList.toggle('light-mode');
      try { localStorage.setItem('theme', light ? 'light' : 'dark'); } catch (e) {}
      sync();
    });
  })();

  var yearEl = document.querySelector('[data-year]');
  if (yearEl) yearEl.textContent = new Date().getFullYear();

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Qubit icon: a Bloch-sphere state vector. It precesses on its own; hovering the card steers its
  // polar angle (top of the card = |0>, bottom = |1>) and speeds the precession up.
  (function () {
    var svg = document.querySelector('.qubit');
    if (!svg) return;
    var card = svg.closest('.tab-card');
    function el(c) { return svg.querySelector(c); }
    var vec = el('.bl-vec'), tip = el('.bl-tip'), halo = el('.bl-halo'), orbit = el('.bl-orbit'),
        pole0 = el('.bl-pole0'), pole1 = el('.bl-pole1');
    var R = 21, SE = Math.sin(22 * Math.PI / 180), CE = Math.cos(22 * Math.PI / 180), TAU = Math.PI * 2;
    var IDLE_TH = 1.05, IDLE_SPIN = 0.9;
    var th = IDLE_TH, thT = IDLE_TH, ph = 0.6, spin = IDLE_SPIN, spinT = IDLE_SPIN;
    function set(node, o) { for (var k in o) node.setAttribute(k, o[k].toFixed(2)); }
    function draw() {
      var st = Math.sin(th), ct = Math.cos(th), y = st * Math.sin(ph);
      var sx = 32 + R * st * Math.cos(ph), sy = 32 - R * (ct * CE + y * SE);
      var depth = 0.55 + 0.45 * (1 - y) / 2;
      set(vec, { x2: sx, y2: sy, opacity: depth });
      set(tip, { cx: sx, cy: sy, opacity: depth });
      set(halo, { cx: sx, cy: sy, opacity: depth * 0.9 });
      set(orbit, { cy: 32 - R * ct * CE, rx: R * st, ry: R * st * SE });
      set(pole0, { r: 2 + 2.4 * Math.pow(Math.max(ct, 0), 6) });
      set(pole1, { r: 2 + 2.4 * Math.pow(Math.max(-ct, 0), 6) });
    }
    var raf = 0, last = 0, live = false;
    function frame(t) {
      var dt = Math.min(Math.max((t - last) / 1000, 0), 0.05), k = 1 - Math.exp(-dt / 0.12);
      last = t;
      th += (thT - th) * k; spin += (spinT - spin) * k;
      ph = (ph + spin * dt) % TAU;
      draw();
      raf = live ? requestAnimationFrame(frame) : 0;
    }
    draw();
    if (reduceMotion) return;
    new IntersectionObserver(function (en) {
      live = en[0].isIntersecting;
      if (live && !raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
    }).observe(svg);
    function rest() { thT = IDLE_TH; spinT = IDLE_SPIN; }
    card.addEventListener('mousemove', function (e) {
      var r = card.getBoundingClientRect();
      thT = 0.18 + Math.min(Math.max((e.clientY - r.top) / r.height, 0), 1) * (Math.PI - 0.36);
      spinT = 3.4;
    });
    card.addEventListener('mouseleave', rest);
    card.addEventListener('focus', function () { thT = Math.PI / 2; spinT = 3.4; });
    card.addEventListener('blur', rest);
  })();

  // Scroll reveal
  var revealEls = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window && !reduceMotion) {
    revealEls.forEach(function (el, i) {
      el.style.transitionDelay = (i % 6) * 0.06 + 's';
    });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    revealEls.forEach(function (el) { io.observe(el); });
  } else {
    revealEls.forEach(function (el) { el.classList.add('in-view'); });
  }

  // Interactive timeline: click or press Enter/Space to expand a milestone
  document.querySelectorAll('.timeline-item').forEach(function (item) {
    function toggle() {
      var open = item.classList.toggle('is-open');
      item.setAttribute('aria-expanded', open);
    }
    item.addEventListener('click', toggle);
    item.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
  });

  // Atoms trail the cursor on desktop (orbiting lag-chain); on touch they splash at
  // the finger and diminish fast as soon as scrolling or touching stops.
  var atomsWrap = document.getElementById('cursor-atoms');
  if (atomsWrap && !reduceMotion) {
    var atoms = atomsWrap.querySelectorAll('.atom');
    if (window.matchMedia('(pointer: coarse)').matches) {
      atomsWrap.classList.add('touch-mode');
      var offsets = [[0, -9], [8, 6], [-8, 6]];
      var fadeTimer = null;
      function splash(x, y) {
        atoms.forEach(function (a, i) {
          a.style.transform = 'translate3d(' + (x + offsets[i][0]) + 'px,' + (y + offsets[i][1]) + 'px,0)';
          a.classList.add('is-visible');
        });
        clearTimeout(fadeTimer);
        fadeTimer = setTimeout(hide, 180);
      }
      function hide() { atoms.forEach(function (a) { a.classList.remove('is-visible'); }); }
      document.addEventListener('touchstart', function (e) { var t = e.touches[0]; if (t) splash(t.clientX, t.clientY); }, { passive: true });
      document.addEventListener('touchmove', function (e) { var t = e.touches[0]; if (t) splash(t.clientX, t.clientY); }, { passive: true });
      document.addEventListener('touchend', hide, { passive: true });
      document.addEventListener('scroll', function () {
        atoms.forEach(function (a) { a.classList.add('is-visible'); });
        clearTimeout(fadeTimer);
        fadeTimer = setTimeout(hide, 180);
      }, { passive: true });
    } else {
      // Critically damped springs (exact solution, so identical feel at 60/120/144 Hz, no overshoot).
      // Each atom chases the one before it; the loop sleeps once everything has settled.
      (function () {
        var W = [26, 15, 9];
        var parts = Array.prototype.map.call(atoms, function () { return { x: 0, y: 0, vx: 0, vy: 0 }; });
        var mx = 0, my = 0, last = 0, raf = 0, parked = true, hideTimer = null, parkTimer = null;
        function frame(t) {
          var dt = Math.min(Math.max((t - last) / 1000, 0), 0.05), tx = mx, ty = my, busy = false;
          last = t;
          for (var i = 0; i < parts.length; i++) {
            var p = parts[i], w = W[i], e = Math.exp(-w * dt);
            var dx = p.x - tx, dy = p.y - ty, jx = p.vx + w * dx, jy = p.vy + w * dy;
            p.x = tx + (dx + jx * dt) * e; p.y = ty + (dy + jy * dt) * e;
            p.vx = (p.vx - jx * w * dt) * e; p.vy = (p.vy - jy * w * dt) * e;
            if (Math.abs(p.x - tx) > 0.05 || Math.abs(p.y - ty) > 0.05 || Math.abs(p.vx) > 0.5 || Math.abs(p.vy) > 0.5) busy = true;
            atoms[i].style.transform = 'translate3d(' + p.x.toFixed(2) + 'px,' + p.y.toFixed(2) + 'px,0)';
            tx = p.x; ty = p.y;
          }
          raf = busy ? requestAnimationFrame(frame) : 0;
        }
        function hide() {
          atoms.forEach(function (a) { a.classList.remove('is-visible'); });
          clearTimeout(parkTimer);
          parkTimer = setTimeout(function () { parked = true; }, 550);
        }
        document.addEventListener('mousemove', function (e) {
          mx = e.clientX; my = e.clientY;
          clearTimeout(parkTimer); clearTimeout(hideTimer);
          if (parked) { // fade in right at the cursor instead of gliding in from where they faded out
            parked = false;
            parts.forEach(function (p, i) {
              p.x = mx; p.y = my; p.vx = 0; p.vy = 0;
              atoms[i].style.transform = 'translate3d(' + mx + 'px,' + my + 'px,0)';
            });
          }
          atoms.forEach(function (a) { a.classList.add('is-visible'); });
          hideTimer = setTimeout(hide, 2200);
          if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
        }, { passive: true });
        document.documentElement.addEventListener('mouseleave', function () { clearTimeout(hideTimer); hide(); });
      })();
    }
  }

  // Side graph: a curve along the y-axis whose peak tracks scroll position, swelling with scroll speed
  var scrollRange = document.getElementById('scrollgraph-range');
  var wavePath = document.getElementById('sg-wave');
  if (scrollRange && wavePath) {
    var scrollWrap = document.querySelector('.scrollgraph');
    function maxScroll() {
      return Math.max(document.documentElement.scrollHeight - window.innerHeight, 1);
    }
    var waveFill = document.getElementById('sg-fill');
    var BINS = 50, base = 8;
    function buildWave(peakY, amp) {
      var sigma = 95, step = 1000 / BINS;
      var d = 'M' + base.toFixed(1) + ',0';
      for (var i = 0; i < BINS; i++) {
        var dy = (step * (i + 0.5)) - peakY;
        var x = base + amp * Math.exp(-(dy * dy) / (2 * sigma * sigma));
        d += ' H' + x.toFixed(1) + ' V' + (step * (i + 1)).toFixed(1);
      }
      return d;
    }
    var lastY = window.scrollY, lastT = performance.now(), idleTimer = null;
    function syncFromScroll() {
      var y = window.scrollY;
      var frac = Math.min(Math.max(y / maxScroll(), 0), 1);
      var peakY = frac * 1000;
      scrollRange.value = Math.round(frac * 1000);
      var amp = 24;
      if (!reduceMotion) {
        var now = performance.now();
        var dt = Math.max(now - lastT, 1);
        var v = Math.abs(y - lastY) / dt;
        lastY = y; lastT = now;
        amp = Math.min(24 + v * 46, 50);
        scrollWrap.classList.add('is-active');
        clearTimeout(idleTimer);
        idleTimer = setTimeout(function () {
          scrollWrap.classList.remove('is-active');
          var settled = buildWave(peakY, 24);
          wavePath.setAttribute('d', settled);
          waveFill.setAttribute('d', settled + ' H' + base + ' Z');
        }, 260);
      }
      var line = buildWave(peakY, amp);
      wavePath.setAttribute('d', line);
      waveFill.setAttribute('d', line + ' H' + base + ' Z');
    }
    window.addEventListener('resize', syncFromScroll);
    var tickRaf = null;
    window.addEventListener('scroll', function () {
      if (!tickRaf) tickRaf = requestAnimationFrame(function () { syncFromScroll(); tickRaf = null; });
    }, { passive: true });
    scrollRange.addEventListener('input', function () {
      window.scrollTo(0, (scrollRange.value / 1000) * maxScroll());
    });
    syncFromScroll();
  }
</script>
