<style>
  :root {
    --bg: #0a0c10;
    --text: #e9e7e2;
    --muted: #8c919c;
    --link: #c89b5a;
    --link-hover: #e4c08d;
    --rule: #222731;
    --avatar-bg: #141820;
    --copper: #c89b5a;
    --copper-light: #e4c08d;
    --copper-glow: rgba(200, 155, 90, 0.38);
    --header-bg: rgba(10, 12, 16, 0.82);
  }

  html.light-mode {
    --bg: #faf8f3;
    --text: #15181d;
    --muted: #656b76;
    --link: #8a6220;
    --link-hover: #6d4c16;
    --rule: #e4dfd3;
    --avatar-bg: #efeade;
    --copper: #8a6220;
    --copper-light: #7a5519;
    --copper-glow: rgba(138, 98, 32, 0.26);
    --header-bg: rgba(250, 248, 243, 0.85);

  body, header { transition: background-color 0.25s ease, color 0.25s ease; }
  html { scroll-behavior: smooth; scrollbar-width: none; -ms-overflow-style: none; }
  html::-webkit-scrollbar { display: none; }
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    font-size: 19px;
    line-height: 1.68;
    overflow-x: hidden;
  }

  .wrap { max-width: var(--content-width, 640px); margin: 0 auto; padding: 48px 24px 96px; }
  @media (min-width: 1024px) { :root { --content-width: 780px; } .wrap { padding-top: 56px; } }
  @media (min-width: 1440px) { :root { --content-width: 860px; } }

  header {
    border-bottom: 1px solid var(--rule);
    margin-bottom: 40px;
    position: sticky;
    top: 0;
    background: var(--header-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 20;
  }
  .header-inner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px 24px;
    padding: 18px 24px;
    max-width: var(--content-width, 640px);
    margin: 0 auto;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .home-doodle { display: inline-flex; line-height: 0; margin-left: 10px; }
  .home-doodle-icon { width: 23px; height: auto; transition: transform 0.2s ease; }
  .home-doodle:hover .home-doodle-icon,
  .home-doodle:focus-visible .home-doodle-icon { transform: translateY(-2px) scale(1.08); }

  .brand-star { display: inline-flex; line-height: 0; }
  .star-icon { width: 22px; height: auto; filter: drop-shadow(0 0 3px var(--copper-glow)); animation: star-shine 3.2s ease-in-out infinite; }
  @keyframes star-shine {
    0%, 100% { filter: brightness(1) drop-shadow(0 0 2px var(--copper-glow)); opacity: 0.85; }
    50% { filter: brightness(1.8) drop-shadow(0 0 6px var(--copper-glow)) drop-shadow(0 0 16px var(--copper-glow)); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .star-icon { animation: none; }
  }
  nav { display: flex; align-items: center; flex-wrap: wrap; margin-left: auto; }
  nav a { font-size: 15px; color: var(--muted); text-decoration: none; margin-left: 22px; }
  nav a:first-child { margin-left: 0; }
  nav a:hover, nav a:focus-visible { color: var(--link); }
  nav a[aria-current="page"] { color: var(--text); border-bottom: 1px solid var(--copper); padding-bottom: 3px; }

  .theme-toggle {
    width: 32px; height: 32px; margin-left: 18px; border-radius: 50%;
    border: 1px solid var(--rule); background: none; display: inline-flex;
    align-items: center; justify-content: center; color: var(--muted);
    cursor: pointer; transition: color 0.2s ease, border-color 0.2s ease;
  }
  .theme-toggle:hover, .theme-toggle:focus-visible { color: var(--copper); border-color: var(--copper); }
  .theme-toggle svg { width: 17px; height: 17px; display: none; }
  .theme-toggle .icon-moon { display: block; }
  html.light-mode .theme-toggle .icon-moon { display: none; }
  html.light-mode .theme-toggle .icon-sun { display: block; }
  .theme-toggle:hover svg, .theme-toggle:focus-visible svg { animation: spin 3.5s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .theme-toggle:hover svg, .theme-toggle:focus-visible svg { animation: none; } }

  .contact-link, .work-link { display: inline-flex; align-items: center; }
  .work-doodle { width: 17px; height: 17px; margin-right: 5px; transform-origin: 50% 15%; }
  .work-link:hover .work-doodle, .work-link:focus-visible .work-doodle { animation: swing 0.6s ease-in-out infinite; }
  @keyframes swing { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
  @media (prefers-reduced-motion: reduce) { .work-link:hover .work-doodle, .work-link:focus-visible .work-doodle { animation: none; } }

  .phone-doodle { width: 17px; height: 17px; margin-right: 5px; transform-origin: 50% 80%; }
  .contact-link:hover .phone-doodle, .contact-link:focus-visible .phone-doodle { animation: ring 0.5s ease-in-out infinite; }
  @keyframes ring { 0%, 100% { transform: rotate(0deg); } 20% { transform: rotate(-14deg); } 40% { transform: rotate(11deg); } 60% { transform: rotate(-9deg); } 80% { transform: rotate(6deg); } }
  @media (prefers-reduced-motion: reduce) { .contact-link:hover .phone-doodle, .contact-link:focus-visible .phone-doodle { animation: none; } }

  h1.page-title {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-weight: 400;
    letter-spacing: -0.01em;
    font-size: clamp(2rem, 4.5vw, 3.2rem);
    line-height: 1.2;
    margin: 0 0 10px;
    color: var(--copper-light);
  }

  p { margin: 0 0 22px; }
  a { color: var(--link); }
  a:hover, a:focus-visible { color: var(--link-hover); }
  a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

  .section-subheading { font-size: 15px; color: var(--muted); margin: 0 0 40px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

  h2.section-heading {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-weight: 600;
    font-size: 26px;
    margin: 44px 0 18px;
    color: var(--text);
  }
  h2.section-heading:first-of-type { margin-top: 0; }

  .reveal {
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .reveal.in-view { opacity: 1; transform: translateY(0); }

  .timeline { position: relative; margin: 0 0 8px; padding-left: 0; }
  .timeline::before {
    content: "";
    position: absolute;
    left: 27px; top: 6px; bottom: 6px;
    width: 2px;
    background: var(--rule);
  }
  .timeline-item { position: relative; padding-left: 72px; margin-bottom: 34px; cursor: pointer; outline: none; border-radius: 6px; }
  .timeline-item:last-child { margin-bottom: 0; }
  .timeline-item:focus-visible { box-shadow: 0 0 0 2px var(--copper-glow); }
  .timeline-logo {
    position: absolute; left: 0; top: 0;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--avatar-bg);
    border: 1px solid var(--rule);
    display: flex; align-items: center; justify-content: center;
    text-align: center; line-height: 1.1; overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
    color: var(--copper-light);
  }
  .timeline-item:hover .timeline-logo, .timeline-item:focus-visible .timeline-logo { border-color: var(--copper); }
  .timeline-date {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 12.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--copper-light); margin-bottom: 4px;
  }
  .timeline-title {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 600; font-size: 17px; color: var(--text); margin: 0 0 2px;
  }
  .timeline-item:hover .timeline-title, .timeline-item:focus-visible .timeline-title { color: var(--copper-light); }
  .timeline-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; color: var(--muted); margin: 0 0 8px; }
  .timeline-chevron {
    display: inline-block; width: 7px; height: 7px; margin-left: 5px;
    border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted);
    transform: rotate(45deg); transition: transform 0.25s ease, border-color 0.2s ease;
    vertical-align: 2px;
  }
  .timeline-item.is-open .timeline-chevron { transform: rotate(-135deg); }
  .timeline-item:hover .timeline-chevron, .timeline-item:focus-visible .timeline-chevron { border-color: var(--copper); }
  .timeline-details-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.35s ease; }
  .timeline-item.is-open .timeline-details-wrap { grid-template-rows: 1fr; }
  .timeline-details-inner { overflow: hidden; }
  .timeline-details-text { font-size: 15.5px; line-height: 1.55; color: var(--muted); font-style: italic; margin: 10px 0 0; }
  .project-card-image {
    width: 100%;
    max-width: 360px;
    aspect-ratio: 16 / 10;
    background: var(--rule);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    margin-top: 8px;
  }
  .project-card-image img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 8px; }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
    .timeline-details-wrap { transition: none; }
  }
  @media (max-width: 480px) {
    .timeline::before { left: 21px; }
    .timeline-item { padding-left: 58px; }
    .timeline-logo { width: 44px; height: 44px; font-size: 9.5px; }
  }

  @media (max-width: 420px) {
    body { font-size: 17px; }
    .wrap { padding: 32px 18px 72px; }
    .header-inner { padding: 14px 18px; }
  }
  .contact { display: flex; gap: 14px; list-style: none; margin: 0; padding: 0 0 26px; border-bottom: 1px solid var(--rule); }
  .contact a {
    display: flex; align-items: center; justify-content: center;
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid var(--rule); color: var(--muted);
    transition: color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .contact a:hover, .contact a:focus-visible { transform: translateY(-2px) scale(1.06); }
  .contact a.gmail:hover, .contact a.gmail:focus-visible { color: #ea4335; border-color: #ea4335; }
  .contact a.linkedin:hover, .contact a.linkedin:focus-visible { color: #0a66c2; border-color: #0a66c2; }
  .contact a.blog:hover, .contact a.blog:focus-visible { color: #34c759; border-color: #34c759; }
  .contact a.twitter:hover, .contact a.twitter:focus-visible { color: var(--text); border-color: var(--text); }
  .contact svg { width: 18px; height: 18px; fill: currentColor; }
  .site-footer { margin-top: 40px; }
  .footer-copy {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px; color: var(--muted); margin: 24px 0 0;
  }
  .cv-link { display: inline-flex; align-items: center; }
  .cv-doodle { width: 17px; height: 17px; margin-right: 5px; transform-origin: 50% 50%; }
  .cv-link:hover .cv-doodle, .cv-link:focus-visible .cv-doodle { animation: cv-pop 0.5s ease-in-out; }
  @keyframes cv-pop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  @media (prefers-reduced-motion: reduce) {
    .cv-link:hover .cv-doodle, .cv-link:focus-visible .cv-doodle { animation: none; }
  }
  .cursor-atoms { position: fixed; inset: 0; overflow: visible; pointer-events: none; z-index: 45; }
  .atom {
    position: fixed; top: 0; left: 0; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px;
    opacity: 0; transition: opacity 0.5s ease; will-change: transform;
  }
  .cursor-atoms.touch-mode .atom { transition: opacity 0.22s ease-out, transform 0.2s ease-out; }
  .atom.is-visible { opacity: 0.75; }
  .atom::before {
    content: ""; position: absolute; inset: 0; border: 1.3px solid var(--copper-light);
    border-radius: 50%; transform: rotate(35deg) scaleY(0.42);
    filter: drop-shadow(0 0 3px var(--copper-glow));
  }
  .atom::after {
    content: ""; position: absolute; width: 3px; height: 3px; top: 50%; left: 50%;
    margin: -1.5px 0 0 -1.5px; background: var(--copper-light); border-radius: 50%;
    box-shadow: 0 0 4px var(--copper-glow);
  }
  .atom:nth-child(2) { width: 10px; height: 10px; margin: -5px 0 0 -5px; }
  .atom:nth-child(3) { width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; }
  .scrollgraph {
    position: fixed;
    top: 50%;
    right: 4px;
    z-index: 25;
    width: 52px;
    height: min(48vh, 420px);
    transform: translateY(-50%);
  }
  .scrollgraph-curve { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; transform: scaleX(-1); }
  .sg-axis { stroke: var(--rule); stroke-width: 2; }
  .sg-fill { fill: var(--copper-light); opacity: 0.16; stroke: none; transition: d 0.2s ease-out, opacity 0.18s ease-out; }
  .scrollgraph.is-active .sg-fill { opacity: 0.3; }
  .sg-wave {
    fill: none;
    stroke: var(--copper-light);
    stroke-width: 3.5;
    stroke-linecap: butt;
    stroke-linejoin: miter;
    filter: drop-shadow(0 0 3px var(--copper-glow));
    transition: d 0.2s ease-out, stroke 0.18s ease-out;
  }
  .scrollgraph.is-active .sg-wave { stroke: var(--copper); }
  .scrollgraph:hover .sg-wave, .scrollgraph:focus-within .sg-wave { stroke: var(--text); }
  .scrollgraph-range {
    -webkit-appearance: none;
    appearance: none;
    position: absolute;
    top: 50%;
    left: 50%;
    background: transparent;
    width: min(48vh, 420px);
    height: 46px;
    margin: 0;
    cursor: ns-resize;
    transform: translate(-50%, -50%) rotate(-90deg);
  }
  .scrollgraph-range:focus-visible { outline: none; }
  .scrollgraph-range::-webkit-slider-runnable-track { width: 100%; height: 46px; background: transparent; }
  .scrollgraph-range::-moz-range-track { width: 100%; height: 46px; background: transparent; border: none; }
  .scrollgraph-range::-webkit-slider-thumb { -webkit-appearance: none; width: 1px; height: 1px; opacity: 0; }
  .scrollgraph-range::-moz-range-thumb { width: 1px; height: 1px; opacity: 0; border: none; }
  @media (prefers-reduced-motion: reduce) {
    .sg-wave { transition: stroke 0.18s ease-out; }
  }
  @media (max-width: 640px) {
    .scrollgraph { display: none; }
  }

  .star-hero { display: flex; justify-content: center; margin: 8px 0 28px; }
  .star-hero .star-icon { width: 92px; height: auto; }
  .fact-card { border: 1px solid var(--rule); border-radius: 10px; padding: 28px 30px; background: var(--avatar-bg); }
  .fact-week {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--copper); margin: 0 0 12px;
  }
  .fact-text { font-size: 20px; margin: 0; }
  .fact-cite { font-size: 14px; color: var(--muted); margin: 10px 0 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
</style>
<script>

    try { if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light-mode'); } catch (e) {}

<script>
  (function () {
    var toggle = document.getElementById('theme-toggle');
    if (!toggle) return;
    function sync() {
      var light = document.documentElement.classList.contains('light-mode');
      toggle.setAttribute('aria-pressed', light);
      toggle.setAttribute('aria-label', light ? 'Switch to dark mode' : 'Switch to light mode');
    }
    sync();
    toggle.addEventListener('click', function () {
      var light = document.documentElement.classList.toggle('light-mode');
      try { localStorage.setItem('theme', light ? 'light' : 'dark'); } catch (e) {}
      sync();
    });
  })();

  var yearEl = document.querySelector('[data-year]');
  if (yearEl) yearEl.textContent = new Date().getFullYear();

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Scroll reveal
  var revealEls = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window && !reduceMotion) {
    revealEls.forEach(function (el, i) {
      el.style.transitionDelay = (i % 6) * 0.06 + 's';
    });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    revealEls.forEach(function (el) { io.observe(el); });
  } else {
    revealEls.forEach(function (el) { el.classList.add('in-view'); });
  }

  // Interactive timeline: click or press Enter/Space to expand a milestone
  document.querySelectorAll('.timeline-item').forEach(function (item) {
    function toggle() {
      var open = item.classList.toggle('is-open');
      item.setAttribute('aria-expanded', open);
    }
    item.addEventListener('click', toggle);
    item.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
  });

  // Atoms trail the cursor on desktop (orbiting lag-chain); on touch they splash at
  // the finger and diminish fast as soon as scrolling or touching stops.
  var atomsWrap = document.getElementById('cursor-atoms');
  if (atomsWrap && !reduceMotion) {
    var atoms = atomsWrap.querySelectorAll('.atom');
    if (window.matchMedia('(pointer: coarse)').matches) {
      atomsWrap.classList.add('touch-mode');
      var offsets = [[0, -9], [8, 6], [-8, 6]];
      var fadeTimer = null;
      function splash(x, y) {
        atoms.forEach(function (a, i) {
          a.style.transform = 'translate3d(' + (x + offsets[i][0]) + 'px,' + (y + offsets[i][1]) + 'px,0)';
          a.classList.add('is-visible');
        });
        clearTimeout(fadeTimer);
        fadeTimer = setTimeout(hide, 180);
      }
      function hide() { atoms.forEach(function (a) { a.classList.remove('is-visible'); }); }
      document.addEventListener('touchstart', function (e) { var t = e.touches[0]; if (t) splash(t.clientX, t.clientY); }, { passive: true });
      document.addEventListener('touchmove', function (e) { var t = e.touches[0]; if (t) splash(t.clientX, t.clientY); }, { passive: true });
      document.addEventListener('touchend', hide, { passive: true });
      document.addEventListener('scroll', function () {
        atoms.forEach(function (a) { a.classList.add('is-visible'); });
        clearTimeout(fadeTimer);
        fadeTimer = setTimeout(hide, 180);
      }, { passive: true });
    } else {
      var lags = [0.24, 0.14, 0.08];
      var mx = innerWidth / 2, my = innerHeight / 2;
      var pos = Array.prototype.map.call(atoms, function () { return { x: mx, y: my }; });
      var hideTimer = null;
      document.addEventListener('mousemove', function (e) {
        mx = e.clientX; my = e.clientY;
        atoms.forEach(function (a) { a.classList.add('is-visible'); });
        clearTimeout(hideTimer);
        hideTimer = setTimeout(function () {
          atoms.forEach(function (a) { a.classList.remove('is-visible'); });
        }, 2200);
      }, { passive: true });
      (function tick() {
        var tx = mx, ty = my;
        for (var i = 0; i < atoms.length; i++) {
          pos[i].x += (tx - pos[i].x) * lags[i];
          pos[i].y += (ty - pos[i].y) * lags[i];
          atoms[i].style.transform = 'translate3d(' + pos[i].x.toFixed(1) + 'px,' + pos[i].y.toFixed(1) + 'px,0)';
          tx = pos[i].x; ty = pos[i].y;
        }
        requestAnimationFrame(tick);
      })();
    }
  }

  // Side graph: a curve along the y-axis whose peak tracks scroll position, swelling with scroll speed
  var scrollRange = document.getElementById('scrollgraph-range');
  var wavePath = document.getElementById('sg-wave');
  if (scrollRange && wavePath) {
    var scrollWrap = document.querySelector('.scrollgraph');
    function maxScroll() {
      return Math.max(document.documentElement.scrollHeight - window.innerHeight, 1);
    }
    var waveFill = document.getElementById('sg-fill');
    var BINS = 50, base = 8;
    function buildWave(peakY, amp) {
      var sigma = 95, step = 1000 / BINS;
      var d = 'M' + base.toFixed(1) + ',0';
      for (var i = 0; i < BINS; i++) {
        var dy = (step * (i + 0.5)) - peakY;
        var x = base + amp * Math.exp(-(dy * dy) / (2 * sigma * sigma));
        d += ' H' + x.toFixed(1) + ' V' + (step * (i + 1)).toFixed(1);
      }
      return d;
    }
    var lastY = window.scrollY, lastT = performance.now(), idleTimer = null;
    function syncFromScroll() {
      var y = window.scrollY;
      var frac = Math.min(Math.max(y / maxScroll(), 0), 1);
      var peakY = frac * 1000;
      scrollRange.value = Math.round(frac * 1000);
      var amp = 24;
      if (!reduceMotion) {
        var now = performance.now();
        var dt = Math.max(now - lastT, 1);
        var v = Math.abs(y - lastY) / dt;
        lastY = y; lastT = now;
        amp = Math.min(24 + v * 46, 50);
        scrollWrap.classList.add('is-active');
        clearTimeout(idleTimer);
        idleTimer = setTimeout(function () {
          scrollWrap.classList.remove('is-active');
          var settled = buildWave(peakY, 24);
          wavePath.setAttribute('d', settled);
          waveFill.setAttribute('d', settled + ' H' + base + ' Z');
        }, 260);
      }
      var line = buildWave(peakY, amp);
      wavePath.setAttribute('d', line);
      waveFill.setAttribute('d', line + ' H' + base + ' Z');
    }
    window.addEventListener('resize', syncFromScroll);
    var tickRaf = null;
    window.addEventListener('scroll', function () {
      if (!tickRaf) tickRaf = requestAnimationFrame(function () { syncFromScroll(); tickRaf = null; });
    }, { passive: true });
    scrollRange.addEventListener('input', function () {
      window.scrollTo(0, (scrollRange.value / 1000) * maxScroll());
    });
    syncFromScroll();
  }

  // Weekly quote: newest entry goes at the TOP; the page always shows QUOTES[QUOTES.length - 1]
  var QUOTES = [
    { week: 1, year: 2026, text: "Hope is a good thing, maybe the best of things.", cite: "\u2014 The Shawshank Redemption" }
  ];
  var currentQuote = QUOTES[QUOTES.length - 1];
  document.getElementById('fact-text').textContent = currentQuote.text;
  document.getElementById('fact-cite').textContent = currentQuote.cite || '';
  document.getElementById('fact-week').textContent = 'Week ' + currentQuote.week + ', ' + currentQuote.year;
</script>
